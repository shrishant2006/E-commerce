{% extends 'base.html' %}

{% block title %}
Seller Registration
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card shadow">

            <div class="card-header bg-warning text-dark text-center">

                <h3>

                    Seller Registration

                </h3>

            </div>

            <div class="card-body">

                <form action="/register_seller" method="POST">

                    <!-- Seller Name -->

                    <div class="mb-3">

                        <label class="form-label">

                            Seller Name

                        </label>

                        <input
                            type="text"
                            name="seller_name"
                            class="form-control"
                            minlength="3"
                            maxlength="50"
                            placeholder="Enter Seller Name"
                            required>

                    </div>

                    <!-- Contact -->

                    <div class="mb-3">

                        <label class="form-label">

                            Contact Number

                        </label>

                        <input
                            type="tel"
                            name="contact"
                            class="form-control"
                            pattern="[0-9]{10}"
                            placeholder="10 Digit Mobile Number"
                            required>

                    </div>

                    <!-- Address -->

                    <div class="mb-3">

                        <label class="form-label">

                            Address

                        </label>

                        <textarea
                            name="address"
                            rows="3"
                            class="form-control"
                            placeholder="Enter Address"
                            required></textarea>

                    </div>

                    <!-- Email -->

                    <div class="mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter Email"
                            required>

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            minlength="6"
                            placeholder="Minimum 6 Characters"
                            required>

                    </div>

                    <!-- Buttons -->

                    <div class="d-grid">

                        <button
                            class="btn btn-warning">

                            Register Seller

                        </button>

                    </div>

                </form>

            </div>

            <div class="card-footer text-center">

                Already Registered?

                <a href="/login">

                    Login Here

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
