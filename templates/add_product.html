{% extends 'base.html' %}

{% block title %}
Add Product
{% endblock %}

{% block content %}

<div class="container">

    <!-- Page Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">

                <i class="bi bi-plus-circle-fill text-success"></i>

                Add New Product

            </h2>

            <p class="text-muted">

                Fill in the product details below.

            </p>

        </div>

        <div>

            <a href="/products"
               class="btn btn-secondary">

                <i class="bi bi-arrow-left"></i>

                Back to Products

            </a>

        </div>

    </div>

    <!-- Product Form -->

    <div class="card shadow">

        <div class="card-header bg-success text-white">

            <h5 class="mb-0">

                Product Information

            </h5>

        </div>

        <div class="card-body">

            <form action="/add_product" method="POST">

                <!-- Product Name -->

                <div class="mb-3">

                    <label class="form-label">

                        Product Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="product_name"
                        placeholder="Enter Product Name"
                        minlength="3"
                        maxlength="100"
                        required>

                </div>

                <!-- Price -->

                <div class="mb-3">

                    <label class="form-label">

                        Price (₹)

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        name="price"
                        min="1"
                        step="0.01"
                        placeholder="Enter Price"
                        required>

                </div>

                <!-- Description -->

                <div class="mb-3">

                    <label class="form-label">

                        Description

                    </label>

                    <textarea
                        class="form-control"
                        name="description"
                        rows="4"
                        placeholder="Enter Product Description"
                        required></textarea>

                </div>

                <!-- Color -->

                <div class="mb-3">

                    <label class="form-label">

                        Color

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="color"
                        placeholder="Enter Product Color"
                        required>

                </div>

                <!-- Size -->

                <div class="mb-3">

                    <label class="form-label">

                        Size

                    </label>

                    <select
                        class="form-select"
                        name="size"
                        required>

                        <option value="">
                            Select Size
                        </option>

                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                        <option>XL</option>
                        <option>XXL</option>

                    </select>

                </div>

                <!-- Rating -->

                <div class="mb-4">

                    <label class="form-label">

                        Rating

                    </label>

                    <select
                        class="form-select"
                        name="rating"
                        required>

                        <option value="">
                            Select Rating
                        </option>

                        <option value="1">⭐ 1</option>
                        <option value="2">⭐⭐ 2</option>
                        <option value="3">⭐⭐⭐ 3</option>
                        <option value="4">⭐⭐⭐⭐ 4</option>
                        <option value="5">⭐⭐⭐⭐⭐ 5</option>

                    </select>

                </div>

                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle"></i>

                        Save Product

                    </button>

                    <button
                        type="reset"
                        class="btn btn-warning">

                        <i class="bi bi-arrow-clockwise"></i>

                        Reset

                    </button>

                    <a href="/products"
                       class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
